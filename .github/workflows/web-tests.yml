name: web-tests

on:
  push:
    branches: [main]
    paths: [site/**, site-tests/**, server/**, worker/**, worker-tests/**, .github/workflows/web-tests.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site-tests/run.mjs
      - run: node worker-tests/run.mjs
  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s server/tests -v
