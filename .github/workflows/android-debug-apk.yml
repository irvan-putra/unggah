name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # Hackathon shortcut: our wrapper jar isn't on Gradle's allowlist, so disable validation.
          # (Long-term fix: regenerate the wrapper with `./gradlew wrapper` on a machine with network access.)
          validate-wrappers: false

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Assert APK package and version
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.vanipy.unggah' versionCode='6' versionName='1.1.4'"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
